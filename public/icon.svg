<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#4cd7f6" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ce3fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Outer ambient glow box -->
  <rect x="5" y="5" width="54" height="54" rx="14" fill="none" stroke="#4cd7f6" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

  <!-- Main dark background card -->
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Inner subtle border -->
  <rect x="7.5" y="7.5" width="49" height="49" rx="11.5" fill="none" stroke="#4cd7f6" stroke-width="0.75" opacity="0.4"/>

  <!-- NX Monospace Bold Text -->
  <text x="32" y="34.5" 
        font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" 
        font-size="23" 
        font-weight="900" 
        letter-spacing="0.5"
        fill="#4cd7f6" 
        text-anchor="middle" 
        dominant-baseline="central"
        style="text-shadow: 0 0 6px rgba(76,215,246,0.6);">NX</text>
</svg>
